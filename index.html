<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tempo</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Inter, Arial, sans-serif;
  background: #f6f7f9;
  color: #171717;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  width: 100%;
  max-width: 420px;
  padding: 24px;
}

.logo {
  text-align: center;
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -1.5px;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #707070;
  margin-bottom: 22px;
  font-size: 14px;
  line-height: 1.5;
}

.card {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 18px;
  padding: 28px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.05);
}

.language-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 20px;
}

.language-row label {
  margin: 0;
  font-size: 12px;
  color: #777;
}

.language-select {
  width: auto;
  padding: 6px 9px;
  font-size: 12px;
  border-radius: 8px;
}

.tabs {
  display: flex;
  background: #f0f1f3;
  padding: 4px;
  border-radius: 10px;
  margin-bottom: 24px;
}

.tab {
  flex: 1;
  border: none;
  background: transparent;
  padding: 10px;
  border-radius: 7px;
  font-weight: 700;
  cursor: pointer;
  color: #666;
}

.tab.active {
  background: white;
  color: #111;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}

.form {
  display: none;
}

.form.active {
  display: block;
}

.field {
  margin-bottom: 16px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 7px;
}

input,
select {
  width: 100%;
  padding: 12px 13px;
  border: 1px solid #d6d9de;
  border-radius: 9px;
  font-size: 15px;
  outline: none;
  background: white;
}

input:focus,
select:focus {
  border-color: #111;
}

button.primary {
  width: 100%;
  border: none;
  background: #111;
  color: white;
  padding: 13px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 4px;
}

button.primary:hover {
  opacity: .86;
}

button.primary:disabled,
.google-button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.google-button {
  width: 100%;
  border: 1px solid #d6d9de;
  background: white;
  color: #171717;
  padding: 12px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.google-button:hover {
  background: #f7f7f7;
}

.divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 22px 0;
  color: #999;
  font-size: 12px;
}

.divider::before,
.divider::after {
  content: "";
  height: 1px;
  background: #e5e7eb;
  flex: 1;
}

.status {
  display: none;
  margin-top: 16px;
  padding: 12px;
  border-radius: 9px;
  font-size: 14px;
  line-height: 1.4;
}

.status.show {
  display: block;
}

.status.success {
  background: #dcfce7;
  color: #166534;
}

.status.error {
  background: #fee2e2;
  color: #991b1b;
}

.info {
  margin-top: 22px;
  padding: 14px;
  background: #f7f8fa;
  border-radius: 10px;
  font-size: 12px;
  color: #666;
  line-height: 1.5;
  text-align: center;
}

@media(max-width:480px) {
  .container {
    padding: 16px;
  }

  .card {
    padding: 22px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">Tempo</div>

  <div class="subtitle" id="subtitle">
    Your personal study and exam planning system
  </div>

  <div class="language-row">

    <label
      for="languageSelect"
      id="languageLabel"
    >
      Language
    </label>

    <select
      id="languageSelect"
      class="language-select"
    >
      <option value="en">English</option>
      <option value="ja">日本語</option>
    </select>

  </div>

  <div class="card">

    <div class="tabs">

      <button
        class="tab active"
        id="loginTab"
        type="button"
      >
        Log in
      </button>

      <button
        class="tab"
        id="registerTab"
        type="button"
      >
        Create account
      </button>

    </div>


    <!-- LOGIN -->

    <form
      id="loginForm"
      class="form active"
    >

      <div class="field">

        <label
          for="loginUsername"
          id="loginUsernameLabel"
        >
          Username
        </label>

        <input
          id="loginUsername"
          type="text"
          autocomplete="username"
          required
          placeholder="Your username"
        >

      </div>

      <div class="field">

        <label
          for="loginPassword"
          id="loginPasswordLabel"
        >
          Password
        </label>

        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          required
          placeholder="Your password"
        >

      </div>

      <button
        id="loginButton"
        class="primary"
        type="submit"
      >
        Log in
      </button>

    </form>


    <!-- REGISTER -->

    <form
      id="registerForm"
      class="form"
    >

      <div class="field">

        <label
          for="registerUsername"
          id="registerUsernameLabel"
        >
          Username
        </label>

        <input
          id="registerUsername"
          type="text"
          minlength="3"
          maxlength="20"
          autocomplete="username"
          required
          placeholder="3–20 characters"
        >

      </div>

      <div class="field">

        <label
          for="displayName"
          id="displayNameLabel"
        >
          Display name
        </label>

        <input
          id="displayName"
          type="text"
          maxlength="40"
          placeholder="What should we call you?"
        >

      </div>

      <div class="field">

        <label
          for="registerPassword"
          id="registerPasswordLabel"
        >
          Password
        </label>

        <input
          id="registerPassword"
          type="password"
          minlength="6"
          autocomplete="new-password"
          required
          placeholder="At least 6 characters"
        >

      </div>

      <div class="field">

        <label
          for="confirmPassword"
          id="confirmPasswordLabel"
        >
          Confirm password
        </label>

        <input
          id="confirmPassword"
          type="password"
          minlength="6"
          autocomplete="new-password"
          required
          placeholder="Enter it again"
        >

      </div>

      <button
        id="registerButton"
        class="primary"
        type="submit"
      >
        Create account
      </button>

    </form>


    <!-- GOOGLE -->

    <div id="googleSection">

      <div class="divider">
        <span id="orText">OR</span>
      </div>

      <button
        id="googleButton"
        class="google-button"
        type="button"
      >
        Continue with Google
      </button>

    </div>


    <div
      id="status"
      class="status"
    ></div>


    <div
      class="info"
      id="infoText"
    >
      Your account keeps your tasks, tests, study sessions and exam progress connected to you.
    </div>

  </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbzHIO3PeuWZfLWxWBUIaoaTi3YRFH-3oDcjCT5l77TBiC0vT1e-WCTqxlcYzxYeJUdK/exec";

const GOOGLE_CLIENT_ID = "";


/* =========================================================
   TRANSLATIONS
========================================================= */

const translations = {

  en: {

    subtitle:
      "Your personal study and exam planning system",

    language:
      "Language",

    login:
      "Log in",

    register:
      "Create account",

    username:
      "Username",

    displayName:
      "Display name",

    password:
      "Password",

    confirmPassword:
      "Confirm password",

    usernamePlaceholder:
      "Your username",

    usernameRegisterPlaceholder:
      "3–20 characters",

    displayNamePlaceholder:
      "What should we call you?",

    passwordPlaceholder:
      "At least 6 characters",

    confirmPasswordPlaceholder:
      "Enter it again",

    loginButton:
      "Log in",

    registerButton:
      "Create account",

    loggingIn:
      "Logging in...",

    creating:
      "Creating account...",

    google:
      "Continue with Google",

    or:
      "OR",

    info:
      "Your account keeps your tasks, tests, study sessions and exam progress connected to you.",

    passwordMismatch:
      "The passwords do not match.",

    invalidUsername:
      "Username must be 3–20 characters and use only letters, numbers or underscores.",

    passwordShort:
      "Password must be at least 6 characters.",

    invalidLogin:
      "Incorrect username or password.",

    usernameTaken:
      "That username is already taken.",

    accountCreated:
      "Account created. Opening your dashboard...",

    loginSuccess:
      "Login successful. Opening your dashboard...",

    connectionError:
      "Could not connect to the server.",

    invalidResponse:
      "The server returned an invalid response.",

    accountError:
      "Could not create your account.",

    googleNotConfigured:
      "Google login is not configured yet.",

    googleError:
      "Google login failed."

  },


  ja: {

    subtitle:
      "高校受験のための学習・計画システム",

    language:
      "言語",

    login:
      "ログイン",

    register:
      "アカウント作成",

    username:
      "ユーザー名",

    displayName:
      "表示名",

    password:
      "パスワード",

    confirmPassword:
      "パスワード確認",

    usernamePlaceholder:
      "ユーザー名を入力",

    usernameRegisterPlaceholder:
      "3〜20文字",

    displayNamePlaceholder:
      "表示する名前",

    passwordPlaceholder:
      "6文字以上",

    confirmPasswordPlaceholder:
      "もう一度入力",

    loginButton:
      "ログイン",

    registerButton:
      "アカウントを作成",

    loggingIn:
      "ログイン中...",

    creating:
      "アカウントを作成中...",

    google:
      "Googleで続ける",

    or:
      "または",

    info:
      "タスク、テスト、学習時間、受験の進捗をアカウントに保存できます。",

    passwordMismatch:
      "パスワードが一致しません。",

    invalidUsername:
      "ユーザー名は3〜20文字で、英字・数字・アンダースコアのみ使用できます。",

    passwordShort:
      "パスワードは6文字以上にしてください。",

    invalidLogin:
      "ユーザー名またはパスワードが正しくありません。",

    usernameTaken:
      "そのユーザー名はすでに使用されています。",

    accountCreated:
      "アカウントを作成しました。ダッシュボードを開きます...",

    loginSuccess:
      "ログインしました。ダッシュボードを開きます...",

    connectionError:
      "サーバーに接続できませんでした。",

    invalidResponse:
      "サーバーから正しい応答が返されませんでした。",

    accountError:
      "アカウントを作成できませんでした。",

    googleNotConfigured:
      "Googleログインがまだ設定されていません。",

    googleError:
      "Googleログインに失敗しました。"

  }

};


let currentLanguage =
  localStorage.getItem("tempoLanguage") || "en";


function t(key) {

  return (
    translations[currentLanguage] &&
    translations[currentLanguage][key]
  ) ||
  translations.en[key] ||
  key;

}


/* =========================================================
   UI
========================================================= */

function applyLanguage() {

  document.documentElement.lang =
    currentLanguage;

  const ids = {

    subtitle: "subtitle",
    language: "languageLabel",
    login: "loginTab",
    register: "registerTab",
    username: "loginUsernameLabel",
    password: "loginPasswordLabel",
    displayName: "displayNameLabel",
    confirmPassword: "confirmPasswordLabel"

  };

  document.getElementById("subtitle").textContent =
    t("subtitle");

  document.getElementById("languageLabel").textContent =
    t("language");

  document.getElementById("loginTab").textContent =
    t("login");

  document.getElementById("registerTab").textContent =
    t("register");

  document.getElementById("loginUsernameLabel").textContent =
    t("username");

  document.getElementById("loginPasswordLabel").textContent =
    t("password");

  document.getElementById("registerUsernameLabel").textContent =
    t("username");

  document.getElementById("displayNameLabel").textContent =
    t("displayName");

  document.getElementById("registerPasswordLabel").textContent =
    t("password");

  document.getElementById("confirmPasswordLabel").textContent =
    t("confirmPassword");

  document.getElementById("loginUsername").placeholder =
    t("usernamePlaceholder");

  document.getElementById("loginPassword").placeholder =
    t("passwordPlaceholder");

  document.getElementById("registerUsername").placeholder =
    t("usernameRegisterPlaceholder");

  document.getElementById("displayName").placeholder =
    t("displayNamePlaceholder");

  document.getElementById("registerPassword").placeholder =
    t("passwordPlaceholder");

  document.getElementById("confirmPassword").placeholder =
    t("confirmPasswordPlaceholder");

  document.getElementById("loginButton").textContent =
    t("loginButton");

  document.getElementById("registerButton").textContent =
    t("registerButton");

  document.getElementById("googleButton").textContent =
    t("google");

  document.getElementById("orText").textContent =
    t("or");

  document.getElementById("infoText").textContent =
    t("info");

}


document
  .getElementById("languageSelect")
  .addEventListener(
    "change",
    function() {

      currentLanguage =
        this.value;

      localStorage.setItem(
        "tempoLanguage",
        currentLanguage
      );

      applyLanguage();

    }
  );


document
  .getElementById("loginTab")
  .addEventListener(
    "click",
    showLogin
  );


document
  .getElementById("registerTab")
  .addEventListener(
    "click",
    showRegister
  );


function showLogin() {

  document
    .getElementById("loginForm")
    .classList.add("active");

  document
    .getElementById("registerForm")
    .classList.remove("active");

  document
    .getElementById("loginTab")
    .classList.add("active");

  document
    .getElementById("registerTab")
    .classList.remove("active");

  clearStatus();

}


function showRegister() {

  document
    .getElementById("registerForm")
    .classList.add("active");

  document
    .getElementById("loginForm")
    .classList.remove("active");

  document
    .getElementById("registerTab")
    .classList.add("active");

  document
    .getElementById("loginTab")
    .classList.remove("active");

  clearStatus();

}


/* =========================================================
   API
========================================================= */

async function api(
  action,
  data = {}
) {

  let response;

  try {

    response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify({
              action,
              ...data
            })
        }
      );

  } catch (error) {

    throw new Error(
      t("connectionError")
    );

  }


  const text =
    await response.text();


  if (!text) {

    throw new Error(
      t("invalidResponse")
    );

  }


  let result;

  try {

    result =
      JSON.parse(text);

  } catch (error) {

    console.error(
      "Tempo API returned:",
      text
    );

    throw new Error(
      t("invalidResponse")
    );

  }


  console.log(
    "Tempo API:",
    action,
    result
  );


  return result;

}


/* =========================================================
   SESSION
========================================================= */

function cleanToken(token) {

  token =
    String(token || "").trim();

  if (
    !token ||
    token === "null" ||
    token === "undefined"
  ) {

    return "";

  }

  return token;

}


function getToken() {

  return cleanToken(
    localStorage.getItem(
      "tempoToken"
    )
  );

}


function saveSession(result) {

  if (
    !result ||
    !result.token
  ) {

    console.error(
      "Invalid login response:",
      result
    );

    throw new Error(
      t("invalidResponse")
    );

  }


  const token =
    cleanToken(
      result.token
    );


  if (!token) {

    throw new Error(
      t("invalidResponse")
    );

  }


  localStorage.setItem(
    "tempoToken",
    token
  );

  localStorage.setItem(
    "examToken",
    token
  );


  if (result.userId) {

    localStorage.setItem(
      "tempoUserId",
      String(result.userId)
    );

  }


  if (result.username) {

    localStorage.setItem(
      "tempoUsername",
      String(result.username)
    );

    localStorage.setItem(
      "examUsername",
      String(result.username)
    );

  }


  if (result.displayName) {

    localStorage.setItem(
      "tempoDisplayName",
      String(result.displayName)
    );

    localStorage.setItem(
      "examDisplayName",
      String(result.displayName)
    );

  }


  if (result.email) {

    localStorage.setItem(
      "tempoEmail",
      String(result.email)
    );

  }


  if (
    result.language === "ja" ||
    result.language === "en"
  ) {

    currentLanguage =
      result.language;

    localStorage.setItem(
      "tempoLanguage",
      currentLanguage
    );

  }

}


function clearSession() {

  [
    "tempoToken",
    "examToken",
    "tempoUserId",
    "tempoUsername",
    "examUsername",
    "tempoDisplayName",
    "examDisplayName",
    "tempoEmail"
  ].forEach(function(key) {

    localStorage.removeItem(key);

  });

}


/* =========================================================
   LOGIN
========================================================= */

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    login
  );


async function login(event) {

  event.preventDefault();

  clearStatus();


  const username =
    document
      .getElementById("loginUsername")
      .value
      .trim()
      .toLowerCase();


  const password =
    document
      .getElementById("loginPassword")
      .value;


  const button =
    document.getElementById(
      "loginButton"
    );


  if (!username || !password) {

    showStatus(
      t("invalidLogin"),
      true
    );

    return;

  }


  button.disabled = true;

  button.textContent =
    t("loggingIn");


  try {

    const result =
      await api(
        "login",
        {
          username,
          password
        }
      );


    if (
      !result ||
      result.success !== true
    ) {

      throw new Error(
        t("invalidLogin")
      );

    }


    if (!result.token) {

      console.error(
        "Server login response has no token:",
        result
      );

      throw new Error(
        t("invalidResponse")
      );

    }


    saveSession(result);


    const token =
      getToken();


    if (!token) {

      throw new Error(
        t("invalidResponse")
      );

    }


    showStatus(
      t("loginSuccess"),
      false
    );


    setTimeout(function() {

      window.location.replace(
        "dashboard.html"
      );

    }, 300);

  }

  catch(error) {

    console.error(
      "Login error:",
      error
    );

    showStatus(
      error.message ||
      t("connectionError"),
      true
    );

  }

  finally {

    button.disabled = false;

    button.textContent =
      t("loginButton");

  }

}


/* =========================================================
   REGISTER
========================================================= */

document
  .getElementById("registerForm")
  .addEventListener(
    "submit",
    register
  );


async function register(event) {

  event.preventDefault();

  clearStatus();


  const username =
    document
      .getElementById("registerUsername")
      .value
      .trim()
      .toLowerCase();


  const displayName =
    document
      .getElementById("displayName")
      .value
      .trim();


  const password =
    document
      .getElementById("registerPassword")
      .value;


  const confirmPassword =
    document
      .getElementById("confirmPassword")
      .value;


  const button =
    document.getElementById(
      "registerButton"
    );


  if (
    !/^[a-zA-Z0-9_]{3,20}$/.test(
      username
    )
  ) {

    showStatus(
      t("invalidUsername"),
      true
    );

    return;

  }


  if (
    password.length < 6
  ) {

    showStatus(
      t("passwordShort"),
      true
    );

    return;

  }


  if (
    password !== confirmPassword
  ) {

    showStatus(
      t("passwordMismatch"),
      true
    );

    return;

  }


  button.disabled = true;

  button.textContent =
    t("creating");


  try {

    const result =
      await api(
        "createUser",
        {
          username,
          password,
          displayName:
            displayName ||
            username,
          language:
            currentLanguage
        }
      );


    if (
      !result ||
      result.success !== true
    ) {

      if (
        result &&
        result.error ===
        "USERNAME_EXISTS"
      ) {

        throw new Error(
          t("usernameTaken")
        );

      }

      throw new Error(
        t("accountError")
      );

    }


    if (!result.token) {

      throw new Error(
        t("invalidResponse")
      );

    }


    saveSession(result);


    showStatus(
      t("accountCreated"),
      false
    );


    setTimeout(function() {

      window.location.replace(
        "dashboard.html"
      );

    }, 300);

  }

  catch(error) {

    console.error(
      "Registration error:",
      error
    );

    showStatus(
      error.message ||
      t("accountError"),
      true
    );

  }

  finally {

    button.disabled = false;

    button.textContent =
      t("registerButton");

  }

}


/* =========================================================
   GOOGLE
========================================================= */

document
  .getElementById("googleButton")
  .addEventListener(
    "click",
    googleLogin
  );


function googleLogin() {

  if (!GOOGLE_CLIENT_ID) {

    showStatus(
      t("googleNotConfigured"),
      true
    );

    return;

  }

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
  message,
  error = false
) {

  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    message;


  status.className =
    "status show " +
    (
      error
        ? "error"
        : "success"
    );

}


function clearStatus() {

  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    "";


  status.className =
    "status";

}


/* =========================================================
   STARTUP
========================================================= */

document
  .getElementById("languageSelect")
  .value =
    currentLanguage;

applyLanguage();


/*
 * We intentionally DO NOT redirect just because
 * localStorage contains a token.
 *
 * This prevents stale/broken tokens from trapping
 * the user in an index/dashboard redirect loop.
 */

console.log(
  "Tempo initialized."
);

console.log(
  "Stored token:",
  getToken()
);

</script>

</body>
</html>
