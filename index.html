<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tempo — Login</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#17233b;font-family:Inter,Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}.box{width:min(410px,calc(100% - 32px));background:#fff;border:1px solid #e4eaf4;border-radius:19px;padding:29px;box-shadow:0 12px 35px #182c5512}.brand{text-align:center;font-size:34px;font-weight:900;letter-spacing:-1.5px}.brand i{color:#3f78ff;font-style:normal}.subtitle{text-align:center;color:#71809a;font-size:14px;line-height:1.5;margin:8px 0 17px}.language{text-align:center;margin-bottom:17px;color:#71809a;font-size:12px}.language select{width:auto;padding:6px 8px;border:1px solid #dce3ee;border-radius:8px;background:#fff}.tabs{display:flex;background:#eef1f6;padding:4px;border-radius:10px;margin-bottom:20px}.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:7px;color:#647089;font-weight:800;cursor:pointer}.tabs button.active{background:#fff;color:#17233b;box-shadow:0 1px 4px #0002}.form{display:none}.form.active{display:block}.field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #dce3ee;border-radius:9px;font:14px inherit}.field input:focus{outline:0;border-color:#3f78ff}.primary{width:100%;margin-top:17px;padding:13px;border:0;border-radius:10px;background:#3f78ff;color:#fff;font-size:15px;font-weight:800;cursor:pointer}.primary:disabled{opacity:.55;cursor:not-allowed}.status{display:none;margin-top:15px;border-radius:9px;padding:11px;font-size:13px;line-height:1.45}.status.show{display:block}.status.error{background:#fee2e2;color:#991b1b}.status.success{background:#dcfce7;color:#166534}.note{margin-top:19px;border-radius:10px;background:#f7f8fb;padding:12px;color:#68758b;text-align:center;font-size:12px;line-height:1.55}@media(max-width:480px){.box{padding:23px}.brand{font-size:30px}}
</style></head><body><main class="box"><div class="brand">Tem<i>po</i></div><p class="subtitle" id="subtitle">Your study and exam coach</p><div class="language"><span id="languageLabel">Language</span> <select id="language"><option value="en">English</option><option value="ja">日本語</option></select></div><div class="tabs"><button id="loginTab" class="active" type="button">Log in</button><button id="registerTab" type="button">Create account</button></div><form id="loginForm" class="form active"><div class="field"><label id="loginUsernameLabel">Username</label><input id="loginUsername" autocomplete="username" required></div><div class="field"><label id="loginPasswordLabel">Password</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><button id="loginButton" class="primary">Log in</button></form><form id="registerForm" class="form"><div class="field"><label id="registerUsernameLabel">Username</label><input id="registerUsername" minlength="3" maxlength="20" autocomplete="username" required></div><div class="field"><label id="displayNameLabel">Display name</label><input id="displayName" maxlength="40"></div><div class="field"><label id="registerPasswordLabel">Password</label><input id="registerPassword" type="password" minlength="6" autocomplete="new-password" required></div><div class="field"><label id="confirmPasswordLabel">Confirm password</label><input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required></div><button id="registerButton" class="primary">Create account</button></form><div id="status" class="status"></div><div id="note" class="note">Your Tempo account keeps your study plans, exam profile, calendar, and progress connected to you.</div></main><script>
const API_URL='https://script.google.com/macros/s/AKfycbxpix5SeNjLy-PoBBV9lsgdwyiPgQuI_3x_ztcr7exs5Wa31UhEcGJJ3hXCXyQz6jPG/exec';
let lang=localStorage.getItem('tempoLanguage')||'en';
const T={en:{subtitle:'Your study and exam coach',language:'Language',login:'Log in',register:'Create account',username:'Username',display:'Display name',password:'Password',confirm:'Confirm password',note:'Your Tempo account keeps your study plans, exam profile, calendar, and progress connected to you.',logging:'Logging in…',creating:'Creating account…',success:'Success. Opening your dashboard…',badLogin:'Incorrect username or password.',badUser:'Username must be 3–20 letters, numbers, or underscores.',short:'Password must be at least 6 characters.',mismatch:'The passwords do not match.',exists:'That username is already taken.',connection:'Could not connect to Tempo. Try again.'},ja:{subtitle:'高校受験のための学習・計画コーチ',language:'言語',login:'ログイン',register:'アカウント作成',username:'ユーザー名',display:'表示名',password:'パスワード',confirm:'パスワード確認',note:'学習計画、受験プロフィール、カレンダー、進捗をアカウントに保存します。',logging:'ログイン中…',creating:'アカウントを作成中…',success:'完了しました。ダッシュボードを開きます…',badLogin:'ユーザー名またはパスワードが正しくありません。',badUser:'ユーザー名は3〜20文字の英字・数字・アンダースコアです。',short:'パスワードは6文字以上にしてください。',mismatch:'パスワードが一致しません。',exists:'そのユーザー名はすでに使われています。',connection:'Tempoに接続できませんでした。もう一度試してください。'}};
const $=id=>document.getElementById(id);const t=k=>(T[lang]||T.en)[k]||k;
function render(){document.documentElement.lang=lang;$('language').value=lang;$('subtitle').textContent=t('subtitle');$('languageLabel').textContent=t('language');$('loginTab').textContent=t('login');$('registerTab').textContent=t('register');$('loginUsernameLabel').textContent=$('registerUsernameLabel').textContent=t('username');$('displayNameLabel').textContent=t('display');$('loginPasswordLabel').textContent=$('registerPasswordLabel').textContent=t('password');$('confirmPasswordLabel').textContent=t('confirm');$('loginButton').textContent=t('login');$('registerButton').textContent=t('register');$('note').textContent=t('note')}
function showStatus(message,error){$('status').textContent=message;$('status').className='status show '+(error?'error':'success')}function clearStatus(){$('status').className='status';$('status').textContent=''}
function tab(register){$('loginForm').classList.toggle('active',!register);$('registerForm').classList.toggle('active',register);$('loginTab').classList.toggle('active',!register);$('registerTab').classList.toggle('active',register);clearStatus()}
async function api(action,data={}){let response;try{response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...data})})}catch(e){throw Error(t('connection'))}let result;try{result=await response.json()}catch(e){throw Error(t('connection'))}if(!result.success)throw Error(result.error||'BACKEND_ERROR');return result}
function saveSession(result){if(!result.token)throw Error('INVALID_RESPONSE');localStorage.setItem('tempoToken',String(result.token));localStorage.setItem('examToken',String(result.token));localStorage.setItem('tempoUsername',result.username||'');localStorage.setItem('tempoDisplayName',result.displayName||result.username||'');localStorage.setItem('tempoLanguage',result.language||lang)}function go(){location.replace('dashboard.html')}
$('loginTab').onclick=()=>tab(false);$('registerTab').onclick=()=>tab(true);$('language').onchange=e=>{lang=e.target.value;localStorage.setItem('tempoLanguage',lang);render()};
$('loginForm').onsubmit=async e=>{e.preventDefault();clearStatus();const btn=$('loginButton');btn.disabled=true;btn.textContent=t('logging');try{const result=await api('login',{username:$('loginUsername').value.trim().toLowerCase(),password:$('loginPassword').value});saveSession(result);showStatus(t('success'));setTimeout(go,300)}catch(err){showStatus(err.message==='INVALID_LOGIN'?t('badLogin'):err.message,true)}finally{btn.disabled=false;btn.textContent=t('login')}};
$('registerForm').onsubmit=async e=>{e.preventDefault();clearStatus();const username=$('registerUsername').value.trim().toLowerCase(),password=$('registerPassword').value;if(!/^[a-zA-Z0-9_]{3,20}$/.test(username))return showStatus(t('badUser'),true);if(password.length<6)return showStatus(t('short'),true);if(password!==$('confirmPassword').value)return showStatus(t('mismatch'),true);const btn=$('registerButton');btn.disabled=true;btn.textContent=t('creating');try{const result=await api('createUser',{username,password,displayName:$('displayName').value.trim()||username,language:lang});saveSession(result);showStatus(t('success'));setTimeout(go,300)}catch(err){showStatus(err.message==='USERNAME_EXISTS'?t('exists'):err.message,true)}finally{btn.disabled=false;btn.textContent=t('register')}};
render();
</script></body></html>
