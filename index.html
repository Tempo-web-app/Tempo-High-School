<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tempo</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Inter, Arial, sans-serif;
  background: #f6f7f9;
  color: #171717;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  width: 100%;
  max-width: 420px;
  padding: 24px;
}

.logo {
  text-align: center;
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -1.5px;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #707070;
  margin-bottom: 28px;
  font-size: 14px;
  line-height: 1.5;
}

.card {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 18px;
  padding: 28px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.05);
}

.tabs {
  display: flex;
  background: #f0f1f3;
  padding: 4px;
  border-radius: 10px;
  margin-bottom: 24px;
}

.tab {
  flex: 1;
  border: none;
  background: transparent;
  padding: 10px;
  border-radius: 7px;
  font-weight: 700;
  cursor: pointer;
  color: #666;
}

.tab.active {
  background: white;
  color: #111;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}

.form {
  display: none;
}

.form.active {
  display: block;
}

.field {
  margin-bottom: 16px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 7px;
}

input,
select {
  width: 100%;
  padding: 12px 13px;
  border: 1px solid #d6d9de;
  border-radius: 9px;
  font-size: 15px;
  outline: none;
  background: white;
  transition: border 0.15s;
}

input:focus,
select:focus {
  border-color: #111;
}

button.primary {
  width: 100%;
  border: none;
  background: #111;
  color: white;
  padding: 13px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 4px;
}

button.primary:hover {
  opacity: 0.86;
}

button.primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.google-button {
  width: 100%;
  border: 1px solid #d6d9de;
  background: white;
  color: #171717;
  padding: 12px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.google-button:hover {
  background: #f7f7f7;
}

.google-button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 22px 0;
  color: #999;
  font-size: 12px;
}

.divider::before,
.divider::after {
  content: "";
  height: 1px;
  background: #e5e7eb;
  flex: 1;
}

.status {
  display: none;
  margin-top: 16px;
  padding: 12px;
  border-radius: 9px;
  font-size: 14px;
  line-height: 1.4;
}

.status.show {
  display: block;
}

.status.success {
  background: #dcfce7;
  color: #166534;
}

.status.error {
  background: #fee2e2;
  color: #991b1b;
}

.language-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 20px;
}

.language-row label {
  margin: 0;
  font-size: 12px;
  color: #777;
}

.language-select {
  width: auto;
  padding: 6px 9px;
  font-size: 12px;
  border-radius: 8px;
}

.info {
  margin-top: 22px;
  padding: 14px;
  background: #f7f8fa;
  border-radius: 10px;
  font-size: 12px;
  color: #666;
  line-height: 1.5;
  text-align: center;
}

.hidden {
  display: none !important;
}

@media(max-width: 480px) {
  .container {
    padding: 16px;
  }

  .card {
    padding: 22px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    Tempo
  </div>

  <div class="subtitle" id="subtitle">
    Your personal study and exam planning system
  </div>

  <div class="language-row">
    <label for="languageSelect" id="languageLabel">Language</label>

    <select
      id="languageSelect"
      class="language-select"
      onchange="changeLanguage()"
    >
      <option value="en">English</option>
      <option value="ja">日本語</option>
    </select>
  </div>

  <div class="card">

    <div class="tabs">

      <button
        class="tab active"
        id="loginTab"
        onclick="showLogin()"
      >
        Log in
      </button>

      <button
        class="tab"
        id="registerTab"
        onclick="showRegister()"
      >
        Create account
      </button>

    </div>

    <!-- LOGIN -->

    <form
      id="loginForm"
      class="form active"
      onsubmit="login(event)"
    >

      <div class="field">

        <label for="loginUsername" id="loginUsernameLabel">
          Username
        </label>

        <input
          id="loginUsername"
          type="text"
          autocomplete="username"
          required
          placeholder="Your username"
        >

      </div>

      <div class="field">

        <label for="loginPassword" id="loginPasswordLabel">
          Password
        </label>

        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          required
          placeholder="Your password"
        >

      </div>

      <button
        id="loginButton"
        class="primary"
        type="submit"
      >
        Log in
      </button>

    </form>

    <!-- REGISTER -->

    <form
      id="registerForm"
      class="form"
      onsubmit="register(event)"
    >

      <div class="field">

        <label for="registerUsername" id="registerUsernameLabel">
          Username
        </label>

        <input
          id="registerUsername"
          type="text"
          autocomplete="username"
          minlength="3"
          maxlength="20"
          required
          placeholder="3–20 characters"
        >

      </div>

      <div class="field">

        <label for="displayName" id="displayNameLabel">
          Display name
        </label>

        <input
          id="displayName"
          type="text"
          maxlength="40"
          placeholder="What should we call you?"
        >

      </div>

      <div class="field">

        <label for="registerPassword" id="registerPasswordLabel">
          Password
        </label>

        <input
          id="registerPassword"
          type="password"
          autocomplete="new-password"
          minlength="6"
          required
          placeholder="At least 6 characters"
        >

      </div>

      <div class="field">

        <label for="confirmPassword" id="confirmPasswordLabel">
          Confirm password
        </label>

        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          minlength="6"
          required
          placeholder="Enter it again"
        >

      </div>

      <button
        id="registerButton"
        class="primary"
        type="submit"
      >
        Create account
      </button>

    </form>

    <!-- GOOGLE LOGIN -->

    <div id="googleSection">

      <div class="divider">
        <span id="orText">OR</span>
      </div>

      <button
        id="googleButton"
        class="google-button"
        type="button"
        onclick="googleLogin()"
      >
        Continue with Google
      </button>

    </div>

    <div
      id="status"
      class="status"
    ></div>

    <div class="info" id="infoText">
      Your account keeps your tasks, tests, study sessions and exam progress connected to you.
    </div>

  </div>

</div>

<script>

/* =========================================================
   CONFIG
========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbzHIO3PeuWZfLWxWBUIaoaTi3YRFH-3oDcjCT5l77TBiC0vT1e-WCTqxlcYzxYeJUdK/exec";

/*
  IMPORTANT:
  Put your Google OAuth Client ID here if you want
  the Google login button to work.

  Example:
  const GOOGLE_CLIENT_ID =
    "1234567890-example.apps.googleusercontent.com";

  If it is left blank, the normal username/password
  login still works.
*/

const GOOGLE_CLIENT_ID = "";


/* =========================================================
   TRANSLATIONS
========================================================= */

const translations = {

  en: {
    subtitle:
      "Your personal study and exam planning system",

    language:
      "Language",

    login:
      "Log in",

    register:
      "Create account",

    username:
      "Username",

    displayName:
      "Display name",

    password:
      "Password",

    confirmPassword:
      "Confirm password",

    usernamePlaceholder:
      "Your username",

    usernameRegisterPlaceholder:
      "3–20 characters",

    displayNamePlaceholder:
      "What should we call you?",

    passwordPlaceholder:
      "At least 6 characters",

    confirmPasswordPlaceholder:
      "Enter it again",

    loginButton:
      "Log in",

    registerButton:
      "Create account",

    loggingIn:
      "Logging in...",

    creating:
      "Creating account...",

    google:
      "Continue with Google",

    or:
      "OR",

    info:
      "Your account keeps your tasks, tests, study sessions and exam progress connected to you.",

    passwordMismatch:
      "The passwords do not match.",

    invalidUsername:
      "Username must be 3–20 characters and use only letters, numbers or underscores.",

    passwordShort:
      "Password must be at least 6 characters.",

    invalidLogin:
      "Incorrect username or password.",

    usernameTaken:
      "That username is already taken.",

    accountCreated:
      "Account created. Opening your dashboard...",

    loginSuccess:
      "Login successful. Opening your dashboard...",

    connectionError:
      "Could not connect to the server.",

    accountError:
      "Could not create your account.",

    googleNotConfigured:
      "Google login is not configured yet.",

    googleError:
      "Google login failed.",

    invalidResponse:
      "The server returned an invalid response."
  },

  ja: {
    subtitle:
      "高校受験のための学習・計画システム",

    language:
      "言語",

    login:
      "ログイン",

    register:
      "アカウント作成",

    username:
      "ユーザー名",

    displayName:
      "表示名",

    password:
      "パスワード",

    confirmPassword:
      "パスワード確認",

    usernamePlaceholder:
      "ユーザー名を入力",

    usernameRegisterPlaceholder:
      "3〜20文字",

    displayNamePlaceholder:
      "表示する名前",

    passwordPlaceholder:
      "6文字以上",

    confirmPasswordPlaceholder:
      "もう一度入力",

    loginButton:
      "ログイン",

    registerButton:
      "アカウントを作成",

    loggingIn:
      "ログイン中...",

    creating:
      "アカウントを作成中...",

    google:
      "Googleで続ける",

    or:
      "または",

    info:
      "タスク、テスト、学習時間、受験の進捗をアカウントに保存できます。",

    passwordMismatch:
      "パスワードが一致しません。",

    invalidUsername:
      "ユーザー名は3〜20文字で、英字・数字・アンダースコアのみ使用できます。",

    passwordShort:
      "パスワードは6文字以上にしてください。",

    invalidLogin:
      "ユーザー名またはパスワードが正しくありません。",

    usernameTaken:
      "そのユーザー名はすでに使用されています。",

    accountCreated:
      "アカウントを作成しました。ダッシュボードを開きます...",

    loginSuccess:
      "ログインしました。ダッシュボードを開きます...",

    connectionError:
      "サーバーに接続できませんでした。",

    accountError:
      "アカウントを作成できませんでした。",

    googleNotConfigured:
      "Googleログインがまだ設定されていません。",

    googleError:
      "Googleログインに失敗しました。",

    invalidResponse:
      "サーバーから正しい応答が返されませんでした。"
  }

};


/* =========================================================
   LANGUAGE
========================================================= */

let currentLanguage =
  localStorage.getItem("tempoLanguage") || "en";


function t(key) {

  return (
    translations[currentLanguage] &&
    translations[currentLanguage][key]
  ) ||
  translations.en[key] ||
  key;

}


function changeLanguage() {

  currentLanguage =
    document
      .getElementById("languageSelect")
      .value;

  localStorage.setItem(
    "tempoLanguage",
    currentLanguage
  );

  applyLanguage();

}


function applyLanguage() {

  document.documentElement.lang =
    currentLanguage;

  document.getElementById("subtitle").textContent =
    t("subtitle");

  document.getElementById("languageLabel").textContent =
    t("language");

  document.getElementById("loginTab").textContent =
    t("login");

  document.getElementById("registerTab").textContent =
    t("register");

  document.getElementById("loginUsernameLabel").textContent =
    t("username");

  document.getElementById("loginPasswordLabel").textContent =
    t("password");

  document.getElementById("registerUsernameLabel").textContent =
    t("username");

  document.getElementById("displayNameLabel").textContent =
    t("displayName");

  document.getElementById("registerPasswordLabel").textContent =
    t("password");

  document.getElementById("confirmPasswordLabel").textContent =
    t("confirmPassword");

  document.getElementById("loginUsername").placeholder =
    t("usernamePlaceholder");

  document.getElementById("loginPassword").placeholder =
    t("passwordPlaceholder");

  document.getElementById("registerUsername").placeholder =
    t("usernameRegisterPlaceholder");

  document.getElementById("displayName").placeholder =
    t("displayNamePlaceholder");

  document.getElementById("registerPassword").placeholder =
    t("passwordPlaceholder");

  document.getElementById("confirmPassword").placeholder =
    t("confirmPasswordPlaceholder");

  document.getElementById("loginButton").textContent =
    t("loginButton");

  document.getElementById("registerButton").textContent =
    t("registerButton");

  document.getElementById("googleButton").textContent =
    t("google");

  document.getElementById("orText").textContent =
    t("or");

  document.getElementById("infoText").textContent =
    t("info");

}


/* =========================================================
   API
========================================================= */

async function api(action, data = {}) {

  let response;

  try {

    response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body: JSON.stringify({
            action: action,
            ...data
          })
        }
      );

  } catch (error) {

    throw new Error(
      t("connectionError")
    );

  }


  const text =
    await response.text();


  let result;

  try {

    result =
      JSON.parse(text);

  } catch (error) {

    throw new Error(
      t("invalidResponse")
    );

  }


  return result;

}


/* =========================================================
   SESSION
========================================================= */

function saveSession(result) {

  if (!result || !result.token) {
    throw new Error(
      t("invalidResponse")
    );
  }

  localStorage.setItem(
    "tempoToken",
    result.token
  );

  /*
    Keep the old key too so existing
    Tempo/ExamOS pages don't suddenly
    forget the user's session.
  */

  localStorage.setItem(
    "examToken",
    result.token
  );

  if (result.username) {

    localStorage.setItem(
      "tempoUsername",
      result.username
    );

    localStorage.setItem(
      "examUsername",
      result.username
    );

  }

  const displayName =
    result.displayName ||
    result.username ||
    "";

  if (displayName) {

    localStorage.setItem(
      "tempoDisplayName",
      displayName
    );

    localStorage.setItem(
      "examDisplayName",
      displayName
    );

  }

  if (result.email) {

    localStorage.setItem(
      "tempoEmail",
      result.email
    );

  }

}


function checkExistingSession() {

  const token =
    localStorage.getItem("tempoToken") ||
    localStorage.getItem("examToken");

  if (token) {

    window.location.href =
      "dashboard.html";

  }

}


/* =========================================================
   TABS
========================================================= */

function showLogin() {

  document
    .getElementById("loginForm")
    .classList.add("active");

  document
    .getElementById("registerForm")
    .classList.remove("active");

  document
    .getElementById("loginTab")
    .classList.add("active");

  document
    .getElementById("registerTab")
    .classList.remove("active");

  clearStatus();

}


function showRegister() {

  document
    .getElementById("registerForm")
    .classList.add("active");

  document
    .getElementById("loginForm")
    .classList.remove("active");

  document
    .getElementById("registerTab")
    .classList.add("active");

  document
    .getElementById("loginTab")
    .classList.remove("active");

  clearStatus();

}


/* =========================================================
   LOGIN
========================================================= */

async function login(event) {

  event.preventDefault();

  const username =
    document
      .getElementById("loginUsername")
      .value
      .trim()
      .toLowerCase();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  const button =
    document
      .getElementById("loginButton");

  if (!username || !password) {

    showStatus(
      t("invalidLogin"),
      true
    );

    return;

  }

  button.disabled = true;

  button.textContent =
    t("loggingIn");

  clearStatus();

  try {

    const result =
      await api(
        "login",
        {
          username:
            username,

          password:
            password
        }
      );

    if (!result.success) {

      const errors = {

        INVALID_LOGIN:
          t("invalidLogin"),

        INVALID_USERNAME:
          t("invalidUsername")

      };

      throw new Error(
        errors[result.error] ||
        result.error ||
        t("invalidLogin")
      );

    }

    saveSession(result);

    showStatus(
      t("loginSuccess"),
      false
    );

    setTimeout(
      function() {
        window.location.href =
          "dashboard.html";
      },
      350
    );

  }

  catch(error) {

    showStatus(
      error.message ||
      t("connectionError"),
      true
    );

  }

  finally {

    button.disabled = false;

    button.textContent =
      t("loginButton");

  }

}


/* =========================================================
   REGISTER
========================================================= */

async function register(event) {

  event.preventDefault();

  const username =
    document
      .getElementById("registerUsername")
      .value
      .trim()
      .toLowerCase();

  const displayName =
    document
      .getElementById("displayName")
      .value
      .trim();

  const password =
    document
      .getElementById("registerPassword")
      .value;

  const confirmPassword =
    document
      .getElementById("confirmPassword")
      .value;

  const button =
    document
      .getElementById("registerButton");

  if (password !== confirmPassword) {

    showStatus(
      t("passwordMismatch"),
      true
    );

    return;

  }

  if (
    !/^[a-zA-Z0-9_]{3,20}$/.test(
      username
    )
  ) {

    showStatus(
      t("invalidUsername"),
      true
    );

    return;

  }

  if (password.length < 6) {

    showStatus(
      t("passwordShort"),
      true
    );

    return;

  }

  button.disabled = true;

  button.textContent =
    t("creating");

  clearStatus();

  try {

    const result =
      await api(
        "createUser",
        {
          username:
            username,

          password:
            password,

          displayName:
            displayName ||
            username
        }
      );

    if (!result.success) {

      const errors = {

        INVALID_USERNAME:
          t("invalidUsername"),

        PASSWORD_TOO_SHORT:
          t("passwordShort"),

        USERNAME_EXISTS:
          t("usernameTaken")

      };

      throw new Error(
        errors[result.error] ||
        result.error ||
        t("accountError")
      );

    }

    saveSession(result);

    /*
      Save the selected language
      to the backend as well.
    */

    try {

      await api(
        "setLanguage",
        {
          token:
            result.token,

          language:
            currentLanguage
        }
      );

    } catch (languageError) {

      /*
        Account creation still succeeded.
        Language sync should never break login.
      */

      console.warn(
        "Could not save language preference:",
        languageError
      );

    }

    showStatus(
      t("accountCreated"),
      false
    );

    setTimeout(
      function() {
        window.location.href =
          "dashboard.html";
      },
      350
    );

  }

  catch(error) {

    showStatus(
      error.message ||
      t("accountError"),
      true
    );

  }

  finally {

    button.disabled = false;

    button.textContent =
      t("registerButton");

  }

}


/* =========================================================
   GOOGLE LOGIN
========================================================= */

function googleLogin() {

  if (!GOOGLE_CLIENT_ID) {

    showStatus(
      t("googleNotConfigured"),
      true
    );

    return;

  }

  /*
    Google Identity Services is loaded
    dynamically only when Google login
    is actually configured.
  */

  if (
    typeof google === "undefined" ||
    !google.accounts ||
    !google.accounts.id
  ) {

    loadGoogleIdentity();

    showStatus(
      currentLanguage === "ja"
        ? "Googleログインを読み込んでいます。もう一度お試しください。"
        : "Loading Google login. Please try again.",
      false
    );

    return;

  }

  startGoogleLogin();

}


function loadGoogleIdentity() {

  if (
    document.getElementById(
      "googleIdentityScript"
    )
  ) {

    return;

  }

  const script =
    document.createElement("script");

  script.id =
    "googleIdentityScript";

  script.src =
    "https://accounts.google.com/gsi/client";

  script.async = true;

  script.defer = true;

  script.onload =
    function() {

      startGoogleLogin();

    };

  script.onerror =
    function() {

      showStatus(
        t("googleError"),
        true
      );

    };

  document.head.appendChild(
    script
  );

}


function startGoogleLogin() {

  if (
    typeof google === "undefined" ||
    !google.accounts ||
    !google.accounts.id
  ) {

    showStatus(
      t("googleError"),
      true
    );

    return;

  }

  google.accounts.id.initialize({

    client_id:
      GOOGLE_CLIENT_ID,

    callback:
      handleGoogleCredential

  });

  google.accounts.id.prompt();

}


async function handleGoogleCredential(response) {

  if (
    !response ||
    !response.credential
  ) {

    showStatus(
      t("googleError"),
      true
    );

    return;

  }

  const button =
    document.getElementById(
      "googleButton"
    );

  button.disabled = true;

  button.textContent =
    currentLanguage === "ja"
      ? "Googleでログイン中..."
      : "Signing in with Google...";

  clearStatus();

  try {

    const result =
      await api(
        "googleLogin",
        {
          idToken:
            response.credential
        }
      );

    if (!result.success) {

      const errors = {

        MISSING_GOOGLE_TOKEN:
          t("googleError"),

        INVALID_GOOGLE_TOKEN:
          t("googleError"),

        INVALID_GOOGLE_ISSUER:
          t("googleError"),

        GOOGLE_CLIENT_MISMATCH:
          t("googleError"),

        GOOGLE_EMAIL_NOT_VERIFIED:
          t("googleError"),

        GOOGLE_LOGIN_ERROR:
          t("googleError")

      };

      throw new Error(
        errors[result.error] ||
        result.error ||
        t("googleError")
      );

    }

    saveSession(result);

    /*
      New Google users get the current
      language preference saved too.
    */

    try {

      await api(
        "setLanguage",
        {
          token:
            result.token,

          language:
            currentLanguage
        }
      );

    } catch (languageError) {

      console.warn(
        "Could not save Google language preference:",
        languageError
      );

    }

    showStatus(
      t("loginSuccess"),
      false
    );

    setTimeout(
      function() {
        window.location.href =
          "dashboard.html";
      },
      350
    );

  }

  catch(error) {

    showStatus(
      error.message ||
      t("googleError"),
      true
    );

  }

  finally {

    button.disabled = false;

    button.textContent =
      t("google");

  }

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
  message,
  error = false
) {

  const status =
    document.getElementById(
      "status"
    );

  status.textContent =
    message;

  status.className =
    "status show " +
    (
      error
        ? "error"
        : "success"
    );

}


function clearStatus() {

  const status =
    document.getElementById(
      "status"
    );

  status.textContent =
    "";

  status.className =
    "status";

}


/* =========================================================
   INITIALIZATION
========================================================= */

document
  .getElementById("languageSelect")
  .value =
    currentLanguage;

applyLanguage();

checkExistingSession();

</script>

</body>
</html>
